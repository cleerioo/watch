<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password | BrandsHub49</title>
    <meta name="description" content="Reset your BrandsHub49 account password." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body>
    <div id="site-header"></div>

    <main class="auth-wrap">
      <div class="auth-card">
        <h1>Forgot Password</h1>
        <p>Enter your registered email and we will send a reset link.</p>
        <form id="forgot-form" class="form-grid">
          <input class="input" type="email" name="email" placeholder="Email" required />
          <button class="btn btn-gold" type="submit">Send Reset Link</button>
        </form>
        <p style="margin-top: 12px;"><a href="login.html">Back to Login</a></p>
      </div>
    </main>

    <div id="site-footer"></div>

    <script src="assets/js/data.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/auth.js"></script>
  </body>
</html>
