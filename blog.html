<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog | BrandsHub49</title>
    <meta
      name="description"
      content="Read watch buying guides, care tips, gift suggestions, and smartwatch insights from BrandsHub49."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body data-page="blog">
    <div id="site-header"></div>

    <main>
      <section
        class="page-hero"
        style="background-image: url('https://images.unsplash.com/photo-1434056886845-dac89ffe9b56?auto=format&fit=crop&w=1800&q=80');"
      >
        <div class="inner">
          <h1>The Watch Journal</h1>
          <p>Watch buying guides, care tips, and latest model insights from our team.</p>
        </div>
      </section>

      <section class="section">
        <div class="container blog-layout">
          <div id="blog-list" class="blog-grid"></div>

          <aside>
            <div class="sidebar-card">
              <h3>Recent Posts</h3>
              <div id="blog-recent"></div>
            </div>

            <div class="sidebar-card">
              <h3>Popular Tags</h3>
              <div id="blog-tags" class="tag-list"></div>
            </div>

            <div class="sidebar-card">
              <h3>Subscribe</h3>
              <p>Get watch guides and latest arrival alerts in your inbox.</p>
              <form id="blog-subscribe-form" class="form-grid">
                <input class="input" type="email" required placeholder="Email address" />
                <button class="btn btn-gold" type="submit">Subscribe</button>
              </form>
            </div>
          </aside>
        </div>
      </section>
    </main>

    <div id="site-footer"></div>

    <script src="assets/js/data.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/blog.js"></script>
  </body>
</html>
