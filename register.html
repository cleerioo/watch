<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register | BrandsHub49</title>
    <meta name="description" content="Create your BrandsHub49 account for faster checkout and order tracking." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body>
    <div id="site-header"></div>

    <main class="auth-wrap">
      <div class="auth-card">
        <h1>Create Account</h1>
        <p>Join BrandsHub49 for faster checkout, order updates, and wishlist sync.</p>
        <form id="register-form" class="form-grid">
          <input class="input" type="text" name="name" placeholder="Full Name" required />
          <input class="input" type="email" name="email" placeholder="Email" required />
          <input class="input" type="tel" name="phone" placeholder="Phone" />
          <input class="input" type="password" name="password" placeholder="Password" required />
          <button class="btn btn-gold" type="submit">Register</button>
        </form>
        <p style="margin-top: 12px;">Already have an account? <a href="login.html">Login</a></p>
      </div>
    </main>

    <div id="site-footer"></div>

    <script src="assets/js/data.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/auth.js"></script>
  </body>
</html>
