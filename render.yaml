services:
  - type: web
    name: brandshub49-store
    env: node
    plan: free
    autoDeploy: true
    healthCheckPath: /api/health
    buildCommand: npm install --omit=dev
    startCommand: npm start
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /tmp/brandshub49
      - key: SESSION_DAYS
        value: 30
      - key: DB_SSL
        value: require
      - key: DATABASE_URL
        sync: false
